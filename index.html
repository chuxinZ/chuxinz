<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Chuxin ZHANG</title>
    <style>
       body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f6fafb; /* background color */
            color: #000105; /* text color */
        }
        a {
            color: #000105; /* link color */
            text-decoration: none;
            font-family: 'Lucida Sans Typewriter', Arial, sans-serif;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }
        a:before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background-color: #9fe7eb;
            z-index: -1;
            transition: all 0.5s;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 10% 90%, 20% 80%, 30% 70%, 40% 60%, 50% 50%, 60% 40%, 70% 30%, 80% 20%, 90% 10%);
        }
        a:hover:before {
            left: 0;
        }
        header {
            border-bottom: 3px solid #f9e7ff; /* header border */
            padding: 10px;
            text-align: center;
            position: fixed;
            width: 100%;
            top: 0;
            background-color: transparent; /* make header transparent */
        }
        h1 {
            margin: 0;
            color: #000105; /* header color */
            font-family: 'Lucida Sans Typewriter';
        }
        nav {
            display: flex;
            justify-content: center; /* align the links in the center */
            list-style-type: none;
            padding: 10px 0;
        }
        nav ul {
            display: flex;
            list-style-type: none;
            padding: 0;
        }
        nav li a {
            margin: 0 60px; /* 0 is the vertical margin, 55px is the horizontal margin */
        }
        main {
            margin: 15px;
            padding-top: 100px; /* to ensure the header does not cover the content */
        }
    </style>
</head>
<body>
    <header>
        <h1>Chuxin ZHANG</h1>
        <nav>
            <ul>
                <li><a href="#about-me">About Me</a></li>
                <li><a href="#education">Education</a></li>
                <li><a href="#research">Research</a></li>
                <li><a href="#personal-life">Personal Life</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div id="about-me">
            <h2>About Me</h2>
            <p>你好！</p>
            <p>Hej hej!</p>
            <p>Bonjour!</p>
            <p>Hello，I am Chuxin ZHANG.</p>
        </div>
        <div id="education">
            <h2>Education</h2>
            <p>这是我关于教育的部分。</p>
        </div>
        <div id="research">
            <h2>Research</h2>
            <p>My research interests are medical Artifical Intelligence.</p>
        </div>
        <div id="personal-life">
            <h2>Personal Life</h2>
            <p>这是我关于个人生活的部分。</p>
        </div>
    </main>
</body>
</html>
