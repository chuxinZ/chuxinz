<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Chuxin ZHANG</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #e3e8f0; /* background color */
            color: #2c2127; /* text color */
        }
        a {
            color: #5680e9; /* link color, also your theme color */
            text-decoration: none;
        }
        a:hover {
            color: #cf2f19; /* link hover color, also your accent color */
        }
        header {
            background-color: #5680e9; /* header background, also your theme color */
            color: #e3e8f0; /* header text color, using the background color for contrast */
            padding: 10px;
            text-align: center;
            position: fixed;
            width: 100%;
            top: 0;
        }
        h1 {
            margin: 0;
        }
        h1:hover {
            color: #cf2f19; /* header hover color, also your accent color */
        }
        nav {
            display: flex;
            justify-content: center; /* align the links in the center */
            list-style-type: none;
            padding: 10px 0;
        }
        nav ul {
            display: flex;
            list-style-type: none;
            padding: 0;
        }
        nav li a {
            margin: 0 20px; /* 0 is the vertical margin, 20px is the horizontal margin */
            padding: 0 10px; /* optional, add some padding to make the clickable area bigger */
        }
        main {
            margin: 15px;
            padding-top: 100px; /* to ensure the header does not cover the content */
        }
    </style>
</head>
<body>
    <header>
        <h1>Chuxin ZHANG</h1>
        <nav>
            <ul>
                <li><a href="#about-me">About Me</a></li>
                <li><a href="#education">Education</a></li>
                <li><a href="#research">Research</a></li>
                <li><a href="#personal-life">Personal Life</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div id="about-me">
            <h2>About Me</h2>
            <p>Hello, I am Chuxin ZHANG.</p>
        </div>
        <div id="education">
            <h2>Education</h2>
            <p>这是我关于教育的部分。</p>
        </div>
        <div id="research">
            <h2>Research</h2>
            <p>My research interests are medical Artifical Intelligence.</p>
        </div>
        <div id="personal-life">
            <h2>Personal Life</h2>
            <p>这是我关于个人生活的部分。</p>
        </div>
    </main>
</body>
</html>
