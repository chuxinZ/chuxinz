<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>你的名字</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }
        header {
            background-color: #333;
            color: white;
            padding: 10px;
            text-align: center;
            position: fixed;
            width: 100%;
            top: 0;
        }
        h1 {
            margin: 0;
        }
        nav {
            display: flex;
            justify-content: space-around;
            list-style-type: none;
            padding: 10px 0;
        }
        nav ul {
            display: flex;
            justify-content: space-around;
            list-style-type: none;
            padding: 0;
        }
        main {
            margin: 15px;
            padding-top: 100px; /* to ensure the header does not cover the content */
        }
    </style>
</head>
<body>
    <header>
        <h1>Chuxin ZHANG</h1>
        <nav>
            <ul>
                <li><a href="#about-me">About Me</a></li>
                <li><a href="#education">Education</a></li>
                <li><a href="#research">Research</a></li>
                <li><a href="#personal-life">Personal Life</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div id="about-me">
            <h2>About Me</h2>
            <p>Hello, I am Chuxin ZHANG.</p>
        </div>
        <div id="education">
            <h2>Education</h2>
            <p>这是我关于教育的部分。</p>
        </div>
        <div id="research">
            <h2>Research</h2>
            <p>My research interests are medical Artifical Intelligence.</p>
        </div>
        <div id="personal-life">
            <h2>Personal Life</h2>
            <p>这是我关于个人生活的部分。</p>
        </div>
    </main>
</body>
</html>
